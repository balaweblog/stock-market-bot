name: Swing Trade Advisor Agent
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  swing-trade-advisor:
    runs-on: ubuntu-latest

    env:
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      EMAIL_CC: ${{ secrets.EMAIL_CC }}
      EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
      NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      STOCKS_JSON: ${{ secrets.STOCKS_JSON }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      DRY_RUN: ${{ github.event.inputs.dry_run }}
      TAVILY_API_KEY : ${{ secrets.TAVILY_API_KEY }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}

      # --- Mandatory-filter thresholds (all optional -- values below match
      # the script's own defaults, so this block currently changes nothing.
      # Edit any value to loosen/tighten that specific filter without
      # touching code. See swing_trade_advisor.py's "Configurable
      # mandatory-filter thresholds" section for what each one enforces. ---
      MIN_GROWTH_YOY_PCT: "20"
      MIN_RISK_REWARD: "2.0"
      MAX_RSI_OVERBOUGHT: "70"
      MAX_DEBT_TO_EQUITY_PCT: "100"
      MIN_ROE_PCT: "10"
      REQUIRE_UPTREND_FILTER: "true"

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt



      - name: Run Option Trade
        run: python swing_trade_advisor.py