name: Mutual Fund Portfolio Advisor Agent
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Write mutual_fund_report.html instead of emailing"
        required: false
        default: "false"
  schedule:
    # 03:00 UTC on the 1st of every month = 08:30 IST, ahead of market
    # open -- matches the "past 30 days" framing of the report. Add a
    # second weekly cron here (e.g. '0 3 * * 1') if you'd rather get this
    # more often; the 30-day lookback window is always relative to
    # "today" so an off-schedule run is never stale.
    - cron: '0 3 1 * *'

permissions:
  contents: read

jobs:
  mutual-fund-advisor:
    runs-on: ubuntu-latest

    env:
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      EMAIL_CC: ${{ secrets.EMAIL_CC }}
      EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      DRY_RUN: ${{ github.event.inputs.dry_run }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Mutual Fund Portfolio Advisor
        run: python mutual_fund_advisor.py

      - name: Upload dry-run report (if DRY_RUN=true)
        if: ${{ github.event.inputs.dry_run == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: mutual-fund-report
          path: mutual_fund_report.html
          if-no-files-found: ignore
