name: Daily Breakout Screener

on:
  workflow_dispatch:
  schedule:
    # 18:30 IST, Mon-Fri (IST = UTC+5:30 -> 13:00 UTC). Run after market
    # close (15:30 IST) with a buffer for NSE's bhavcopy file to actually
    # be published, which is typically not instant.
    - cron: "0 13 * * 1-5"

permissions:
  contents: read

jobs:
  breakout-screener:
    runs-on: ubuntu-latest

    env:
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      EMAIL_CC: ${{ secrets.EMAIL_CC }}
      EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Daily Breakout Screener
        run: python -m controllers.breakout_controller