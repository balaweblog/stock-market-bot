name: Stock Market News Advisor Agent
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Write stock_market_report.html instead of emailing"
        required: false
        default: "false"
  schedule:
    # 03:00 UTC every Monday = 08:30 IST, ahead of market open -- gives
    # a clean "past 7 days" wrap of the prior trading week. Add more
    # cron lines here (e.g. '0 3 * * 4' for a mid-week check-in) if you
    # want this more than once a week; the 7-day lookback window is
    # always relative to "today" so an off-schedule run is never stale.
    - cron: '0 3 * * 1'

permissions:
  contents: read

jobs:
  stock-market-advisor:
    runs-on: ubuntu-latest

    env:
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      EMAIL_CC: ${{ secrets.EMAIL_CC }}
      EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      STOCK_WATCHLIST_JSON: ${{ secrets.STOCK_WATCHLIST_JSON }}
      DRY_RUN: ${{ github.event.inputs.dry_run }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Stock Market News Advisor
        run: python -m controllers.nifty_stock_controller

      - name: Upload dry-run report (if DRY_RUN=true)
        if: ${{ github.event.inputs.dry_run == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: stock-market-report
          path: stock_market_report.html
          if-no-files-found: ignore
